[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "myne-cli"
version = "0.5.2"
description = "My Music. My Queue. My Experience. A terminal-first streaming music player."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "typer>=0.16,<1", "rich>=13.9,<15", "questionary>=2,<3",
  "textual>=6.12,<7", "ytmusicapi>=1.10,<2", "yt-dlp[default]>=2026.8.19",
  "platformdirs>=4,<5",
  "packaging>=24,<27",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11", "mypy>=1.15", "build>=1.2"]

[project.scripts]
myne = "myne.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/myne"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
